[project]
name = "harness"
version = "0.1.0"
description = "A streaming, tool-using agent harness for local LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Aldasouqi", email = "ahmadaldasouqi559@gmail.com" }]
dependencies = [
    "aiofiles>=25.1.0",
    "ollama>=0.6.2",
    "rich>=15.0.0",
]

[project.urls]
Repository = "https://github.com/ADHFMZ7/harness"
Issues = "https://github.com/ADHFMZ7/harness/issues"

[project.scripts]
harness = "harness.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

